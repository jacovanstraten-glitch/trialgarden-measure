<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in…</title>
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<style>
 body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#00554B;color:#fff;}
 .box{max-width:320px;text-align:center;padding:24px}
 .sp{display:inline-block;width:20px;height:20px;
     border:3px solid rgba(255,255,255,.3);border-top-color:#fff;
     border-radius:50%;animation:s .8s linear infinite;margin-bottom:12px}
 @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="sp"></div>
  <div>Completing sign-in…</div>
  <div style="opacity:.6;margin-top:8px;font-size:12px">You'll be redirected back to Trial Garden.</div>
</div>
<script>
(async () => {
  try {
    const pca = new msal.PublicClientApplication({
      auth: {
        clientId: "d3f7ecc6-cdf5-4a5a-8528-263b09f6e3a4",
        authority: "https://login.microsoftonline.com/consumers",
        redirectUri: location.origin + location.pathname
      },
      cache: { cacheLocation: "localStorage" }
    });
    await pca.initialize();
    await pca.handleRedirectPromise();
    // handleRedirectPromise stores the result; go back to the app root.
    location.replace(new URL("./", location.href).href);
  } catch (e) {
    document.body.innerHTML = "<div style='padding:24px;text-align:center;'>"
      + "Sign-in error: " + (e && e.message ? e.message : e)
      + "<br><a style='color:#FBED0E' href='./'>Back to app</a></div>";
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9F55AE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TG Field">
<link rel="manifest" href="./mobile-manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Trial Garden Field</title>
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js" async></script>
<style>
:root{
  /* Trial Garden Field = same brand tokens, but with PURPLE as the primary
     surface so it reads visually distinct from the (green-headed) AER Field App. */
  --green:#00554B; --green-dark:#003d37; --green-soft:#e0ede9;
  --purple:#9F55AE; --purple-dark:#7a3d87; --purple-soft:#f2e5f5;
  --yellow:#FBED0E; --yellow-soft:#fdf9c8;
  --bg:#FBF7FC; --card:#fff;   /* slight purple tint on background */
  --ink:#1c1f24; --muted:#5a6270; --muted-2:#8a94a1;
  --line:rgba(0,0,0,.08); --line-strong:#c8ccd3;
  --danger:#c62828; --danger-soft:#fdecea; --ok:#2e7d32;
  --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--purple);color:#fff;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
header .back{
  background:transparent;border:0;color:#fff;
  font-size:22px;line-height:1;padding:4px 6px;cursor:pointer;
  display:none;
}
header .back.on{display:block}
header h1{
  font-size:18px;margin:0;font-weight:700;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
header .hbtn{
  background:rgba(255,255,255,.14);border:0;color:#fff;
  border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer;
}
header .badge{
  min-width:20px;height:20px;border-radius:10px;
  background:var(--yellow);color:#000;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
  padding:0 6px;margin-left:4px;
}
.accent{
  height:6px;background:linear-gradient(90deg,var(--purple),var(--green));
  position:relative;
}
.accent::after{
  content:"";position:absolute;right:3px;top:-1px;
  width:8px;height:8px;border-radius:50%;background:var(--yellow);
}
.accent::before{
  content:"";position:absolute;left:3px;top:-1px;
  width:8px;height:8px;border-radius:50%;background:var(--yellow);
}
main{
  flex:1;padding:16px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.screen{display:none}
.screen.on{display:block;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
/* ---------- CARDS / LISTS ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin:0 0 12px;
  box-shadow:var(--shadow);
}
h2.section{
  font-size:13px;margin:18px 2px 8px;color:var(--muted);
  font-weight:700;text-transform:uppercase;letter-spacing:.03em;
}
label{
  display:block;font-size:13px;color:var(--muted);
  margin:0 0 4px;font-weight:600;
}
input,select,textarea{
  width:100%;font:inherit;padding:12px;
  border:1px solid var(--line-strong);border-radius:10px;
  background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--purple);outline-offset:-1px;
}
textarea{min-height:80px;resize:vertical}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:0;border-radius:12px;padding:14px 16px;
  font-size:16px;font-weight:700;cursor:pointer;
  background:var(--green);color:#fff;text-align:center;
  font-family:inherit;
}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn.ghost{background:#eef0f2;color:var(--ink)}
.btn.hero{padding:20px 16px;font-size:20px;flex-direction:column;gap:2px}
.btn.hero small{font-weight:500;font-size:12px;opacity:.9}
.btn.sm{width:auto;padding:9px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:20px;font-size:13px;font-weight:700;
  background:#eceff1;color:#607d8b;
}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.yellow{background:var(--yellow-soft);color:#7a5f00}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:ui-monospace,monospace}
.kv{display:flex;gap:8px;padding:3px 0;font-size:15px}
.kv b{min-width:130px;color:var(--muted);font-weight:600}
.list-item{
  display:flex;gap:10px;align-items:center;
  padding:14px;border:1px solid var(--line);border-radius:12px;
  margin:0 0 8px;background:#fff;cursor:pointer;
}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:700}
.list-item .s{font-size:13px;color:var(--muted);margin-top:2px}
.list-item .code{
  min-width:44px;text-align:center;font-family:ui-monospace,monospace;
  font-weight:700;color:var(--green);font-size:13px;
  background:var(--green-soft);border-radius:6px;padding:4px 6px;
}
.arrow{color:var(--muted-2);font-size:22px}
.banner{
  border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px;
}
.banner.warn{background:#fff3e0;color:#7a4f00;border:1px solid #ffcc80}
.banner.info{background:var(--green-soft);color:var(--green);border:1px solid #9ecfc6}
.banner.error{background:var(--danger-soft);color:var(--danger);border:1px solid #f5a5a0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 8px}
.empty p{margin:0 0 14px}
/* ---------- OBSERVATIONS ---------- */
.obs{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin:0 0 8px;
}
.obs .when{font-weight:600;font-size:13px}
.obs .who{color:var(--muted);font-size:12px}
.obs .body{white-space:pre-wrap;margin:6px 0}
.obs-photos{display:flex;flex-wrap:wrap;gap:6px}
.obs-photos img{
  width:72px;height:72px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);background:#eee;
}
/* ---------- PHOTO PICKER ---------- */
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{
  width:88px;height:88px;border-radius:10px;object-fit:cover;
  border:1px solid var(--line);position:relative;
}
.thumb .rm{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;
  border-radius:11px;background:var(--danger);color:#fff;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  cursor:pointer;
}
.addphoto{
  width:88px;height:88px;border-radius:10px;
  border:1.5px dashed var(--purple);background:#faf5fc;color:var(--purple);
  font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-direction:column;gap:2px;font-family:inherit;
}
.addphoto small{font-size:10px;font-weight:600}
/* ---------- CAMERA / SCANNER ---------- */
#camWrap{
  position:fixed;inset:0;background:#000;z-index:50;
  display:none;flex-direction:column;
}
#camWrap.on{display:flex}
#camVideo{
  flex:1;width:100%;object-fit:cover;background:#000;
}
.cambar{
  display:flex;gap:12px;align-items:center;justify-content:center;
  padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  background:#000;
}
.cambar button{
  background:#fff;color:#000;border:0;border-radius:26px;
  padding:12px 20px;font-weight:700;font-family:inherit;font-size:15px;
}
.cambar button.dark{background:#333;color:#fff}
.scan-overlay{
  position:absolute;pointer-events:none;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.scan-frame{
  width:70%;max-width:280px;aspect-ratio:1/1;
  border:3px solid #fff;border-radius:16px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.35);
}
.scan-hint{
  position:absolute;bottom:120px;left:0;right:0;text-align:center;
  color:#fff;font-size:14px;padding:0 20px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
/* ---------- MODAL ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-back.center{align-items:center;padding:16px}
.modal{
  background:#fff;border-radius:16px 16px 0 0;
  width:100%;max-width:640px;max-height:88vh;overflow:auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.modal-back.center .modal{border-radius:16px;max-width:420px}
.modal-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1;
}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:16px 18px}
.modal-foot{
  padding:12px 18px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;
  position:sticky;bottom:0;background:#fff;
}
/* ---------- PHOTO VIEWER (full-screen, zoom + pan + swipe) ---------- */
#photoViewer{
  position:fixed;inset:0;background:#000;z-index:200;
  display:none;flex-direction:column;
}
#photoViewer.on{display:flex}
#photoViewer .pv-top{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(0,0,0,.7);
}
#pvCount{color:#fff;font-size:14px;font-weight:600;flex:1;text-align:center}
#pvStage{
  flex:1;overflow:hidden;position:relative;touch-action:none;
  display:flex;align-items:center;justify-content:center;background:#000;
}
#pvImg{
  max-width:100%;max-height:100%;transform-origin:center center;
  will-change:transform;user-select:none;-webkit-user-drag:none;
  transition:transform .05s linear;
}
#photoViewer .pv-bar{
  display:flex;gap:8px;justify-content:center;align-items:center;
  padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.7);
}
.pv-btn{
  background:rgba(255,255,255,.16);color:#fff;border:0;
  border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;min-width:44px;
}
.pv-btn:disabled{opacity:.4}
.pv-btn.danger{background:rgba(198,40,40,.9)}
.pv-btn.wide{flex:1}
/* ---------- MIC BUTTON (voice-to-text) ---------- */
.field-with-mic{position:relative}
.field-with-mic textarea{padding-right:52px}
.mic-btn{
  position:absolute;top:10px;right:10px;
  width:36px;height:36px;border-radius:18px;
  background:var(--purple-soft);color:var(--purple);border:1.5px solid var(--purple);
  font-size:18px;line-height:1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.mic-btn.rec{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* ---------- TOAST ---------- */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 16px;border-radius:8px;
  font-size:14px;z-index:300;opacity:0;transition:opacity .2s;
  pointer-events:none;max-width:88%;text-align:center;
}
#toast.on{opacity:1}
#toast.error{background:var(--danger)}
#toast.success{background:var(--ok)}
/* ---------- SPINNER ---------- */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;
}
.spinner.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- SYNC STATUS TILE ---------- */
.status-tile{
  display:flex;gap:10px;align-items:center;
  padding:10px 12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;margin:0 0 12px;font-size:13px;
}
.status-tile .dot{width:10px;height:10px;border-radius:5px;background:var(--danger)}
.status-tile.ok .dot{background:var(--ok)}
.status-tile.warn .dot{background:var(--yellow)}
.status-tile .grow{flex:1;min-width:0}
.status-tile b{display:block;font-weight:600;font-size:13px}
.status-tile .m{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="btnBack" aria-label="Back">←</button>
    <h1 id="hTitle">Trial Garden</h1>
    <button class="hbtn" id="btnMenu" aria-label="Menu">☰</button>
  </header>
  <div class="accent"></div>
  <main id="main"></main>
</div>
<div id="camWrap">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="scan-overlay"><div class="scan-frame"></div></div>
  <div class="scan-hint" id="scanHint">Point the camera at the label QR code</div>
  <div class="cambar">
    <button class="dark" id="camCancel">Cancel</button>
    <button id="camManual">Type code</button>
  </div>
</div>
<div id="photoViewer" aria-hidden="true">
  <div class="pv-top">
    <button class="pv-btn" id="pvClose">✕ Close</button>
    <span id="pvCount"></span>
    <button class="pv-btn danger" id="pvDelete">🗑 Delete</button>
  </div>
  <div id="pvStage"><img id="pvImg" alt=""></div>
  <div class="pv-bar">
    <button class="pv-btn" id="pvPrev">‹ Prev</button>
    <button class="pv-btn" id="pvZoomOut">－</button>
    <button class="pv-btn" id="pvReset">100%</button>
    <button class="pv-btn" id="pvZoomIn">＋</button>
    <button class="pv-btn" id="pvNext">Next ›</button>
  </div>
</div>
<div id="toast"></div>

<script>
/* ==================================================================
   Trial Garden Field — mobile PWA
   Signs in with Microsoft, resolves a shared OneDrive folder,
   reads _index.json, scans QR labels, records observations with photos
   and uploads them as "delta" files to _inbox/ for the desktop app.
   ================================================================== */

const APP_VERSION = "2026-09-20 · r3";

/* ---------- config ---------- */
const MSAL_CLIENT_ID  = "d3f7ecc6-cdf5-4a5a-8528-263b09f6e3a4";
const MSAL_AUTHORITY  = "https://login.microsoftonline.com/consumers";
const GRAPH_SCOPES    = ["Files.ReadWrite","User.Read"];
const SHARE_URL       = "https://1drv.ms/f/c/06cb787230e7d161/IgB-KkdiENHASIDTXpVNv267AWwQa9PoquGA7m2pxdX4wis";
const GRAPH_BASE      = "https://graph.microsoft.com/v1.0";

/* ---------- tiny helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    n.appendChild(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (n=10) => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"") : Math.random().toString(36).slice(2)).slice(0,n);
const nowISO = () => new Date().toISOString();
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "";
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const fmtBytes = b => { if(b==null) return ""; const u=["B","KB","MB","GB"], i=Math.min(u.length-1,Math.floor(Math.log(Math.max(b,1))/Math.log(1024))); return (b/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i]; };

function toast(msg, kind="") {
  const t = $("#toast");
  t.textContent = msg; t.className = "on " + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = ""; }, kind==="error" ? 4200 : 2400);
}

/* ---------- IndexedDB (device buffer) ---------- */
const IDB_NAME = "tg-field-v1";
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if (!db.objectStoreNames.contains("outbox")) db.createObjectStore("outbox", {keyPath:"id"});
      if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", {keyPath:"id"});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(store, key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  });
}
async function idbPut(store, val, key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    (key !== undefined) ? os.put(val, key) : os.put(val);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbDelete(store, key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbAll(store) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error);
  });
}

/* ---------- state ---------- */
const state = {
  msal: null, account: null,
  workspaceRef: null,    // {driveId, itemId} of the shared Trial Garden folder
  data: null,            // parsed _index.json
  dataFetchedAt: null,
  online: navigator.onLine,
  pending: 0,            // outbox count
  route: {view:"home"},
  history: []
};

/* ---------- MSAL ---------- */
let msalReadyPromise = null;
async function initMsal() {
  if (msalReadyPromise) return msalReadyPromise;
  msalReadyPromise = (async () => {
    // wait until msal-browser is loaded (async script)
    let waits = 0;
    while (typeof msal === "undefined" && waits < 60) { await new Promise(r=>setTimeout(r,100)); waits++; }
    if (typeof msal === "undefined") throw new Error("MSAL library did not load — are you online?");
    state.msal = new msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CLIENT_ID,
        authority: MSAL_AUTHORITY,
        redirectUri: new URL("./redirect.html", location.href).href
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    });
    await state.msal.initialize();
    const res = await state.msal.handleRedirectPromise();
    if (res && res.account) state.msal.setActiveAccount(res.account);
    else {
      const accs = state.msal.getAllAccounts();
      if (accs.length && !state.msal.getActiveAccount()) state.msal.setActiveAccount(accs[0]);
    }
    state.account = state.msal.getActiveAccount();
    return state.msal;
  })();
  return msalReadyPromise;
}
async function signIn() {
  await initMsal();
  try {
    await state.msal.loginRedirect({ scopes: GRAPH_SCOPES, prompt: "select_account" });
  } catch (e) {
    toast("Sign-in failed: " + (e.message || e), "error");
  }
}
async function signOut() {
  if (!state.msal) return;
  try { state.msal.setActiveAccount(null); } catch {}
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && (k.indexOf(MSAL_CLIENT_ID) >= 0 || k.indexOf("msal.") === 0)) localStorage.removeItem(k);
    }
  } catch {}
  state.account = null;
  msalReadyPromise = null;
  await idbDelete("kv", "workspaceRef");
  state.workspaceRef = null;
  toast("Signed out", "success");
  navigate({view:"home"});
}
async function getToken() {
  await initMsal();
  const acc = state.msal.getActiveAccount();
  if (!acc) throw new Error("Not signed in");
  try {
    const r = await state.msal.acquireTokenSilent({scopes:GRAPH_SCOPES, account:acc});
    return r.accessToken;
  } catch (e) {
    // fallback to redirect
    await state.msal.acquireTokenRedirect({scopes:GRAPH_SCOPES, account:acc});
    throw e;
  }
}

/* ---------- Graph helpers ---------- */
async function graph(path, opts={}) {
  const token = await getToken();
  const url = path.startsWith("http") ? path : GRAPH_BASE + path;
  const headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
  if (opts.json != null) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.json);
    delete opts.json;
  }
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if (!r.ok) {
    let msg;
    try { const j = await r.json(); msg = j?.error?.message; } catch {}
    throw new Error(`Graph ${r.status} ${msg || r.statusText}`);
  }
  if (r.status === 204) return null;
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? await r.json() : await r.blob();
}

function encodeShareUrl(url) {
  const b64 = btoa(url).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
  return "u!" + b64;
}
async function resolveWorkspace() {
  if (state.workspaceRef) return state.workspaceRef;
  const cached = await idbGet("kv", "workspaceRef");
  if (cached) { state.workspaceRef = cached; return cached; }
  const item = await graph(`/shares/${encodeShareUrl(SHARE_URL)}/driveItem`, {
    headers: { Prefer: "redeemSharingLinkIfNecessary" }
  });
  const driveId = item.parentReference?.driveId ?? item.remoteItem?.parentReference?.driveId;
  const itemId  = item.remoteItem?.id || item.id;
  if (!driveId || !itemId) throw new Error("Could not resolve shared Trial Garden folder — check the share link and access.");
  const ref = {driveId, itemId, name: item.name || "Trial Garden"};
  state.workspaceRef = ref;
  await idbPut("kv", ref, "workspaceRef");
  return ref;
}
function itemUrl(sub) {
  const {driveId, itemId} = state.workspaceRef;
  return `/drives/${driveId}/items/${itemId}${sub}`;
}
async function loadIndex({fresh=false} = {}) {
  if (!fresh && state.data) return state.data;
  await resolveWorkspace();
  try {
    const blob = await graph(itemUrl(`:/_index.json:/content`));
    const txt = await (blob instanceof Blob ? blob.text() : Promise.resolve(blob));
    state.data = JSON.parse(typeof txt === "string" ? txt : JSON.stringify(txt));
    state.dataFetchedAt = nowISO();
    await idbPut("kv", {data:state.data, at:state.dataFetchedAt}, "cachedIndex");
  } catch (e) {
    // fall back to cached copy
    const cached = await idbGet("kv", "cachedIndex");
    if (cached) {
      state.data = cached.data;
      state.dataFetchedAt = cached.at;
      toast("Offline — using cached data from " + fmtDateTime(cached.at), "");
    } else {
      throw e;
    }
  }
  return state.data;
}

/* ---------- data lookups ---------- */
function trialById(id)     { return state.data.trials.find(t=>t.id===id); }
function trialByCode(code) { return state.data.trials.find(t => (t.code||"").toLowerCase() === (code||"").toLowerCase()); }
function treatmentByCode(trial, code) { return trial.treatments.find(t=> (t.code||"").toLowerCase() === (code||"").toLowerCase()); }
function parseLabel(payload) {
  // payload example: TR-2026-0002-T07-R03
  const m = String(payload||"").trim().match(/^(.+?)-(T\d+)-R(\d+)$/i);
  if (!m) return null;
  return { trialCode: m[1], treatmentCode: m[2].toUpperCase(), replicate: parseInt(m[3],10) };
}
function resolveLabel(payload) {
  const p = parseLabel(payload);
  if (!p) return {error:"Not a Trial Garden label (expected e.g. TR-2026-0002-T07-R03)"};
  if (!state.data) return {error:"Trial data not loaded yet"};
  const trial = trialByCode(p.trialCode);
  if (!trial) return {error:`Trial "${p.trialCode}" not found in this workspace`, parsed:p};
  const treatment = treatmentByCode(trial, p.treatmentCode);
  if (!treatment) return {error:`Treatment "${p.treatmentCode}" not found in trial ${trial.code}`, parsed:p};
  const reps = treatment.replicatesOverride ?? trial.defaultReplicates ?? 3;
  if (p.replicate < 1 || p.replicate > reps) return {error:`Replicate ${p.replicate} out of range (1–${reps})`, parsed:p};
  return {trial, treatment, replicate:p.replicate};
}

/* ---------- OUTBOX ---------- */
async function refreshPendingCount() {
  const items = await idbAll("outbox");
  state.pending = items.filter(x => x.status !== "synced").length;
  const b = $("#hBadge"); if (b) b.textContent = state.pending || "";
}
async function enqueueObservation(observation, photoBlobs) {
  const id = "delta_" + uid(12);
  const now = nowISO();
  // photos → idb
  const photoRecs = [];
  for (const [i, blob] of photoBlobs.entries()) {
    const pid = id + "-p" + String(i+1).padStart(2,"0");
    const name = pid + "-" + (blob.name || `photo.jpg`).replace(/[^A-Za-z0-9._-]+/g,"_");
    await idbPut("photos", {id:pid, blob, name, mime: blob.type || "image/jpeg"});
    photoRecs.push({id:pid, name, size:blob.size, mime: blob.type || "image/jpeg"});
  }
  const record = {
    id, createdAt: now, status: "pending",
    observation, // {scope, trialId, targetId, replicate, at, author, text}
    photos: photoRecs,
    tries: 0
  };
  await idbPut("outbox", record);
  await refreshPendingCount();
  attemptSync().catch(()=>{});
  return record;
}
async function attemptSync() {
  if (!navigator.onLine) return;
  if (!state.msal || !state.msal.getActiveAccount()) return;
  const items = await idbAll("outbox");
  const pending = items.filter(x => x.status !== "synced");
  if (!pending.length) return;
  await resolveWorkspace();
  for (const rec of pending) {
    try {
      await syncOne(rec);
    } catch (e) {
      console.warn("sync failed for", rec.id, e);
      rec.tries = (rec.tries||0) + 1;
      rec.lastError = String(e.message || e);
      await idbPut("outbox", rec);
    }
  }
  await refreshPendingCount();
  updateStatusTile();
}
async function syncOne(rec) {
  // Upload photos into _inbox/attachments/
  const uploaded = [];
  for (const p of rec.photos || []) {
    const stored = await idbGet("photos", p.id);
    if (!stored) continue;
    await uploadFile(`:/_inbox/attachments/${p.name}:/content`, stored.blob, stored.mime);
    uploaded.push({id:p.id, name:p.name, size: stored.blob.size, mime: p.mime});
  }
  // Build delta json
  const trial = trialById(rec.observation.trialId);
  const delta = {
    schema: 1,
    kind: "field-delta",
    id: rec.id,
    createdAt: rec.createdAt,
    device: state.deviceId || (state.deviceId = getDeviceId()),
    account: state.msal.getActiveAccount()?.username || null,
    trialCode: trial?.code,
    trialId: rec.observation.trialId,
    observation: rec.observation,
    photos: uploaded.map(u => ({id:u.id, filename:u.name, size:u.size, mime:u.mime}))
  };
  const blob = new Blob([JSON.stringify(delta, null, 2)], {type:"application/json"});
  await uploadFile(`:/_inbox/${rec.id}.json:/content`, blob, "application/json");
  // done — mark synced, delete photos from idb
  rec.status = "synced";
  rec.syncedAt = nowISO();
  await idbPut("outbox", rec);
  for (const p of rec.photos || []) { try { await idbDelete("photos", p.id); } catch {} }
}
async function uploadFile(itemSub, blob, mime) {
  const token = await getToken();
  const url = GRAPH_BASE + itemUrl(itemSub);
  const r = await fetch(url, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": mime || "application/octet-stream"
    },
    body: blob
  });
  if (!r.ok) {
    let msg;
    try { const j = await r.json(); msg = j?.error?.message; } catch {}
    throw new Error(`Upload ${r.status} ${msg || r.statusText}`);
  }
  return r.json();
}
function getDeviceId() {
  let id = localStorage.getItem("tg-device-id");
  if (!id) { id = "dev_" + uid(10); localStorage.setItem("tg-device-id", id); }
  return id;
}

let camStream = null, scanTimer = null, barcodeDetector = null;
async function startScan() {
  if (!("mediaDevices" in navigator && navigator.mediaDevices.getUserMedia)) {
    toast("Camera not available on this device — using code entry instead");
    return manualLabel();
  }
  try { camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal:"environment"}}}); }
  catch (e) { toast("Camera denied — try Type code", "error"); return manualLabel(); }
  const v = $("#camVideo"); v.srcObject = camStream;
  $("#camWrap").classList.add("on");
  $("#scanHint").textContent = "Point the camera at the label QR code";
  // barcode detection
  if ("BarcodeDetector" in window) {
    try { barcodeDetector = new BarcodeDetector({formats:["qr_code"]}); }
    catch { barcodeDetector = null; }
  }
  clearInterval(scanTimer);
  scanTimer = setInterval(scanTick, 500);
}
async function scanTick() {
  const v = $("#camVideo");

  try {
    const results = await barcodeDetector.detect(v);
    if (results && results.length) {
      const raw = results[0].rawValue || results[0].rawValue;
      if (raw) onLabelScanned(String(raw));

  } catch (e) { /* ignore */ }
}

  clearInterval(scanTimer); scanTimer = null;

/* =====================================================================
   PHOTO OVERLAY  (burn trial + treatment info onto every captured photo)
   ===================================================================== */
function overlayLinesFor(ctx) {
  // ctx = {scope, trialId, targetId, replicate}
  // At most 3 lines, in this order:
  //   1. <TrialCode> [· R##] [· TreatmentCode]
  //   2. Treatment (or trial) name — omitted for trial-scope shots with no name
  //   3. Timestamp
  if (!state.data) return [];
  const trial = trialById(ctx.trialId);
  if (!trial) return [];
  const stamp = new Date().toLocaleString(undefined, {year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  const lines = [];
  if (ctx.scope === "trial") {
    lines.push(trial.code || "");
    if (trial.name) lines.push(trial.name);
    lines.push(stamp);
  } else {
    const tr = trial.treatments.find(x => x.id === ctx.targetId);
    const parts = [trial.code || ""];
    if (ctx.scope === "replicate") parts.push("R" + String(ctx.replicate).padStart(2,"0"));
    if (tr?.code) parts.push(tr.code);
    lines.push(parts.filter(Boolean).join(" · "));
    if (tr?.name) lines.push(tr.name);
    lines.push(stamp);
  }
  return lines.slice(0, 3);
}
async function burnOverlay(blob, lines) {
  if (!lines || !lines.length) return blob;
  try {
    // Prefer createImageBitmap (respects EXIF orientation on modern browsers)
    let bmp;
    try { bmp = await createImageBitmap(blob, {imageOrientation:"from-image"}); }
    catch { bmp = await createImageBitmap(blob); }
    const w = bmp.width, h = bmp.height;
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bmp, 0, 0);
    // font size proportional to shortest side
    const shortSide = Math.min(w, h);
    const fontPx = Math.max(18, Math.round(shortSide * 0.032));
    const pad = Math.round(fontPx * 0.7);
    ctx.font = `bold ${fontPx}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
    ctx.textBaseline = "top";
    // measure & wrap each line to canvas width (- 2*pad)
    const maxW = w - 2*pad;
    const MAX_LINES = 3;
    const drawn = [];
    outer: for (const raw of lines) {
      if (!raw) continue;
      const words = String(raw).split(/\s+/);
      let cur = "";
      for (const wd of words) {
        const cand = cur ? cur + " " + wd : wd;
        if (ctx.measureText(cand).width > maxW && cur) {
          drawn.push(cur);
          if (drawn.length >= MAX_LINES) break outer;
          cur = wd;
        } else cur = cand;
      }
      if (cur) {
        drawn.push(cur);
        if (drawn.length >= MAX_LINES) break;
      }
    }
    // Ellipsize the last kept line if it's the third and there was more to draw.
    if (drawn.length === MAX_LINES) {
      const last = drawn[MAX_LINES - 1];
      // measure last line + ellipsis and truncate if it would still overflow
      let s = last;
      while (ctx.measureText(s + "…").width > maxW && s.length > 1) s = s.slice(0, -1);
      if (s !== last) drawn[MAX_LINES - 1] = s + "…";
    }
    const lineH = fontPx + Math.round(fontPx * 0.25);
    const stripH = Math.min(drawn.length * lineH + 2*pad, Math.round(h * 0.4));
    // dark strip
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(0, h - stripH, w, stripH);
    // brand accent line at the top of the strip
    ctx.fillStyle = "#9F55AE";
    ctx.fillRect(0, h - stripH, w, 3);
    ctx.fillStyle = "#fff";
    for (let i = 0; i < drawn.length; i++) {
      ctx.fillText(drawn[i], pad, h - stripH + pad + i * lineH);
    }
    // yellow "vein" dot on the right of the accent line
    ctx.fillStyle = "#FBED0E";
    ctx.beginPath();
    ctx.arc(w - Math.round(pad*0.6), h - stripH + 1, 5, 0, Math.PI*2);
    ctx.fill();

    const out = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.88));
    return out || blob;
  } catch (e) {
    console.warn("overlay burn failed:", e);
    return blob;
  }
}

/* =====================================================================
   PHOTO VIEWER  (full-screen with zoom / pan / prev / next / delete)
   ===================================================================== */
const pv = {
  photos: null,        // array-of-Blob or array-of-{blob, name}
  index: 0,
  onDelete: null,
  scale: 1,
  tx: 0, ty: 0,
  pointerA: null, pointerB: null,
  urls: []
};
function openPhotoViewer({photos, initialIndex=0, onDelete=null}) {
  pv.photos = photos;
  pv.index = Math.max(0, Math.min(initialIndex, photos.length - 1));
  pv.onDelete = onDelete;
  pv.scale = 1; pv.tx = 0; pv.ty = 0;
  // create object URLs for each photo (deferred)
  pv.urls = photos.map(p => (p instanceof Blob) ? URL.createObjectURL(p) : (p.url || (p.blob ? URL.createObjectURL(p.blob) : null)));
  $("#pvDelete").style.display = onDelete ? "" : "none";
  $("#photoViewer").classList.add("on");
  pvUpdate();
  document.body.style.overflow = "hidden";
}
function pvUpdate() {
  if (!pv.photos || !pv.photos.length) { closePhotoViewer(); return; }
  pv.index = Math.max(0, Math.min(pv.index, pv.photos.length - 1));
  $("#pvImg").src = pv.urls[pv.index] || "";
  $("#pvCount").textContent = (pv.index + 1) + " / " + pv.photos.length;
  $("#pvPrev").disabled = pv.index === 0;
  $("#pvNext").disabled = pv.index === pv.photos.length - 1;
  pvApplyTransform();
}
function pvApplyTransform() {
  const img = $("#pvImg");
  img.style.transform = `translate(${pv.tx}px, ${pv.ty}px) scale(${pv.scale})`;
}
function pvResetZoom() { pv.scale = 1; pv.tx = 0; pv.ty = 0; pvApplyTransform(); }
function pvNext() { if (pv.index < pv.photos.length - 1) { pv.index++; pvResetZoom(); pvUpdate(); } }
function pvPrev() { if (pv.index > 0) { pv.index--; pvResetZoom(); pvUpdate(); } }
function pvZoom(factor) { pv.scale = Math.max(1, Math.min(6, pv.scale * factor)); if (pv.scale === 1) { pv.tx = pv.ty = 0; } pvApplyTransform(); }
function pvDelete() {
  if (!pv.onDelete || !pv.photos.length) return;
  const idx = pv.index;
  // release the URL for the deleted one
  const u = pv.urls[idx]; if (u && u.startsWith("blob:")) URL.revokeObjectURL(u);
  pv.urls.splice(idx, 1);
  pv.onDelete(idx);
  if (!pv.photos.length) { closePhotoViewer(); return; }
  if (pv.index >= pv.photos.length) pv.index = pv.photos.length - 1;
  pvResetZoom();
  pvUpdate();
}
function closePhotoViewer() {
  $("#photoViewer").classList.remove("on");
  document.body.style.overflow = "";
  for (const u of pv.urls) if (u && u.startsWith("blob:")) URL.revokeObjectURL(u);
  pv.urls = []; pv.photos = null; pv.onDelete = null;
}
/* pointer / touch handlers for pinch + pan + swipe */
(function bindPV(){
  const stage = $("#pvStage");
  const active = new Map();
  let startDist = 0, startScale = 1, startTx = 0, startTy = 0, startX = 0, startY = 0, swipeCandidate = false;
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId);
    active.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (active.size === 1) {
      startX = e.clientX; startY = e.clientY;
      startTx = pv.tx; startTy = pv.ty;
      swipeCandidate = pv.scale === 1;
    } else if (active.size === 2) {
      const pts = [...active.values()];
      startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      startScale = pv.scale;
      swipeCandidate = false;
    }
  });
  stage.addEventListener("pointermove", e => {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (active.size === 2) {
      const pts = [...active.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (startDist > 0) {
        pv.scale = Math.max(1, Math.min(6, startScale * (d / startDist)));
        if (pv.scale === 1) { pv.tx = pv.ty = 0; }
        pvApplyTransform();
      }
    } else if (active.size === 1 && pv.scale > 1) {
      pv.tx = startTx + (e.clientX - startX);
      pv.ty = startTy + (e.clientY - startY);
      pvApplyTransform();
    }
  });
  stage.addEventListener("pointerup", e => {
    const rec = active.get(e.pointerId);
    active.delete(e.pointerId);
    if (rec && swipeCandidate && active.size === 0) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
        if (dx < 0) pvNext(); else pvPrev();
      }
    }
  });
  stage.addEventListener("pointercancel", e => active.delete(e.pointerId));
  // double-tap to zoom
  let lastTap = 0;
  stage.addEventListener("click", e => {
    const now = Date.now();
    if (now - lastTap < 350) { pvZoom(pv.scale > 1 ? 0.5 : 2); }
    lastTap = now;
  });
})();
$("#pvClose").addEventListener("click", closePhotoViewer);
$("#pvPrev").addEventListener("click", pvPrev);
$("#pvNext").addEventListener("click", pvNext);
$("#pvZoomIn").addEventListener("click", () => pvZoom(1.4));

  else if (e.key === "ArrowLeft") pvPrev();
  else if (e.key === "ArrowRight") pvNext();
  else if (e.key === "+" || e.key === "=") pvZoom(1.4);
  else if (e.key === "-") pvZoom(1/1.4);
  else if (e.key === "0") pvResetZoom();
});
async function confirmDialogSimple(message) {
  return new Promise(res => {
    const back = el("div", {class:"modal-back center", onclick:(e)=>{ if (e.target===back) { document.body.removeChild(back); res(false); } }});
    const modal = el("div", {class:"modal"});
    modal.appendChild(el("div", {class:"modal-body"}, el("p", {}, message)));
    modal.appendChild(el("div", {class:"modal-foot"},
      el("button", {class:"btn sm ghost", onclick:()=>{ document.body.removeChild(back); res(false); }}, "Cancel"),
      el("button", {class:"btn sm", style:{background:"var(--danger)", color:"#fff", width:"auto"},
        onclick:()=>{ document.body.removeChild(back); res(true); }}, "Delete")
    ));
    back.appendChild(modal); document.body.appendChild(back);
  });
}

/* =====================================================================
   VOICE-TO-TEXT (Web Speech API) — 🎤 button on the observation textarea
   ===================================================================== */
let recog = null, recogBtn = null;
function speechLang() {
  return localStorage.getItem("tg-speech-lang") || navigator.language || "en-US";
}
function toggleSpeech(ta, btn) {
  if (recog && recog._active && recogBtn === btn) { stopSpeech(); return; }
  if (recog && recog._active) stopSpeech();
  startSpeech(ta, btn);
}
function startSpeech(ta, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Voice input isn't available on this device", "error"); return; }
  recog = new SR();
  recog.lang = speechLang();
  recog.interimResults = true;
  recog.continuous = true;
  let committed = ta.value ? ta.value.replace(/\s+$/, "") + " " : "";
  recog.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) committed += r[0].transcript.trim() + " ";
      else interim += r[0].transcript;
    }
    ta.value = (committed + interim).replace(/\s+/g, " ");
  };
  recog.onerror = (e) => {
    if (e && (e.error === "not-allowed" || e.error === "service-not-allowed")) {
      toast("Microphone permission needed", "error"); stopSpeech();
    } else if (e && e.error === "no-speech") { /* keep listening */ }
    else if (e && e.error === "language-not-supported") {
      toast("Language " + recog.lang + " not supported — using en-US", "error");
      stopSpeech();
      localStorage.setItem("tg-speech-lang", "en-US");
    } else if (e && e.error) {
      toast("Voice: " + e.error, "error"); stopSpeech();
    }
  };
  recog.onend = () => {
    if (recog && recog._active) { try { recog.start(); } catch {} }
    else { if (recogBtn) { recogBtn.classList.remove("rec"); recogBtn.textContent = "🎤"; recogBtn = null; } recog = null; }
  };
  recog._active = true;
  recogBtn = btn;
  btn.classList.add("rec");
  btn.textContent = "⏹";
  try { recog.start(); } catch (e) { console.warn(e); }
}
function stopSpeech() {
  if (recog) { recog._active = false; try { recog.stop(); } catch {} }
  if (recogBtn) { recogBtn.classList.remove("rec"); recogBtn.textContent = "🎤"; recogBtn = null; }
}

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener("online", () => { updateStatusTile(); attemptSync().catch(()=>{}); });
window.addEventListener("offline", () => updateStatusTile());

(async function boot() {
  try {
    await initMsal();
    state.account = state.msal.getActiveAccount();
    await refreshPendingCount();
    if (state.account) {
      // load workspace + index in background
      try {
        await resolveWorkspace();
        await loadIndex({fresh:true});
      } catch (e) {
        toast("Could not load trial data: " + e.message, "error");
        // fall back to cache if any
        const cached = await idbGet("kv", "cachedIndex");
        if (cached) { state.data = cached.data; state.dataFetchedAt = cached.at; }
      }
      attemptSync().catch(()=>{});
    }
  } catch (e) {
    console.error(e);
    toast("Startup: " + e.message, "error");
  }
  render();
  // service worker
  if ("serviceWorker" in navigator) {
    try { await navigator.serviceWorker.register("./mobile-sw.js"); } catch (e) { console.warn(e); }
  }
})();
</script>

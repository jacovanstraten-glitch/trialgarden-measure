<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>Math Trainer – Chapter 2</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e6e1d6;--accent:#2f6fde;--ok:#1f9d55;--okbg:#e7f6ed;--bad:#d64545;--badbg:#fdecec;--fig:#fbeec7;--hint:#fff8e1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:17px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.title{font-weight:700;font-size:16px;flex:1}
.stats{font-size:13px;color:var(--mute);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-top:14px}
.card:first-child{margin-top:0}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:#eaf1fd;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.chip.retry{color:#9a5b00;background:#fff3dc}
.chip.test{color:#fff;background:var(--ink)}
.prompt{font-size:18px;font-weight:600;margin:0 0 12px}
.fig{width:100%;height:auto;max-height:360px;display:block;margin:4px 0 12px;background:#fffdf7;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:manipulation}
.fig.tap{cursor:crosshair}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.chosen{border-color:var(--accent);background:#eaf1fd}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.numrow .unit{color:var(--mute);font-size:16px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15.5px;display:none}
.fb.ok{display:block;background:var(--okbg);border:1px solid #bfe5cc}
.fb.bad{display:block;background:var(--badbg);border:1px solid #f3c4c4}
.fb b.v{display:block;font-size:16px;margin-bottom:4px}
.next{margin-top:14px;width:100%;padding:13px;font-size:16px;display:none}
.hintbtn{margin-top:12px;background:var(--hint);border-color:#f1dc9b;color:#7a5a00}
.hints{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.hintbox{background:var(--hint);border:1px solid #f1dc9b;border-radius:12px;padding:10px 12px;font-size:15px}
.hintbox b{color:#7a5a00}
.panel{display:none}
.panel.open{display:block}
.sk{display:grid;grid-template-columns:1fr 64px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sk:last-child{border-bottom:0}
.bar{grid-column:1 / -1;height:7px;background:#eee9de;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.sel{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;margin:6px 0 12px}
.small{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
h3{margin:0 0 6px;font-size:16px}
.ready{display:flex;flex-direction:column;gap:8px}
.ready .top{display:flex;align-items:center;gap:10px}
.ready .top b{flex:1;font-size:15px}
.ready .bar{height:9px}
.ready.done{border-color:#bfe5cc;background:var(--okbg)}
.grade{font-size:56px;font-weight:800;line-height:1;margin:6px 0}
.grade.pass{color:var(--ok)}.grade.fail{color:var(--bad)}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv .h{display:flex;gap:8px;align-items:baseline;font-weight:600}
.rv .mark{font-size:18px}
.rv .ans{font-size:14.5px;margin-top:4px}
.rv .ex{font-size:14.5px;margin-top:6px;background:#f8f6f1;border-radius:10px;padding:8px 10px}
.hist{font-size:14px;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.prog{height:5px;background:#eee9de;border-radius:3px;overflow:hidden;margin:-2px 0 12px}
.prog i{display:block;height:100%;background:var(--ink)}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="title">Math Trainer · Ch. 2</div>

<main>

  </section>
  <section class="card panel" id="result"></section>
</main>
<script>
/* ---------- helpers ---------- */
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>{const r=Math.round(n*100)/100;return String(r).replace('.',',')};
const P=(x,y)=>({x,y});
const add=(p,q)=>P(p.x+q.x,p.y+q.y), sub=(p,q)=>P(p.x-q.x,p.y-q.y), mul=(p,k)=>P(p.x*k,p.y*k);
const len=p=>Math.hypot(p.x,p.y), dist=(p,q)=>len(sub(p,q)), mid=(p,q)=>P((p.x+q.x)/2,(p.y+q.y)/2);
const norm=p=>{const l=len(p)||1;return P(p.x/l,p.y/l)}, perp=p=>P(-p.y,p.x);
const dot=(p,q)=>p.x*q.x+p.y*q.y;
const angleAt=(A,B,C)=>Math.acos(Math.max(-1,Math.min(1,dot(sub(B,A),sub(C,A))/(dist(A,B)*dist(A,C)))));
function circumcenter(A,B,C){const d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));const a2=A.x*A.x+A.y*A.y,b2=B.x*B.x+B.y*B.y,c2=C.x*C.x+C.y*C.y;return P((a2*(B.y-C.y)+b2*(C.y-A.y)+c2*(A.y-B.y))/d,(a2*(C.x-B.x)+b2*(A.x-C.x)+c2*(B.x-A.x))/d)}
function incenter(A,B,C){const a=dist(B,C),b=dist(A,C),c=dist(A,B),s=a+b+c;return P((a*A.x+b*B.x+c*C.x)/s,(a*A.y+b*B.y+c*C.y)/s)}
const centroid=(A,B,C)=>P((A.x+B.x+C.x)/3,(A.y+B.y+C.y)/3);
function orthocenter(A,B,C){const O=circumcenter(A,B,C);return sub(add(add(A,B),C),mul(O,2))}
function foot(p,a,b){const d=sub(b,a);const t=dot(sub(p,a),d)/dot(d,d);return add(a,mul(d,t))}
function inradius(A,B,C){const a=dist(B,C),b=dist(A,C),c=dist(A,B),s=(a+b+c)/2;return Math.sqrt(s*(s-a)*(s-b)*(s-c))/s}

function randTri(kind){
  for(let i=0;i<2000;i++){
    const A=P(R(0,10),R(0,8)),B=P(R(0,10),R(0,8)),C=P(R(0,10),R(0,8));
    const s=[dist(B,C),dist(A,C),dist(A,B)];
    if(Math.min(...s)<3.2)continue;
    const an=[angleAt(A,B,C),angleAt(B,A,C),angleAt(C,A,B)];
    const mn=Math.min(...an),mx=Math.max(...an);
    if(mn<0.45)continue;
    const ss=s.slice().sort((a,b)=>a-b);
    if(ss[1]-ss[0]<0.7||ss[2]-ss[1]<0.7)continue; // not isosceles
    if(kind==='acute'&&mx>1.45)continue;
    if(kind==='obtuse'&&(mx<1.78||mx>2.15))continue;
    return [A,B,C];
  }
  return [P(1,7),P(9,7),P(4,1)];
}

/* ---------- SVG figure builder ---------- */
class Fig{
  constructor(pts,pad=0.16){
    const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
    const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
    const size=Math.max(maxx-minx,maxy-miny,1);
    const pd=size*pad;
    this.vb=[minx-pd,miny-pd,maxx-minx+2*pd,maxy-miny+2*pd];
    this.u=size/100;this.parts=[];this.cls='';
  }
  line(p,q,c='#1d2433',w=2,dash=false){this.parts.push(`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke" stroke-linecap="round"${dash?' stroke-dasharray="6 5"':''}/>`);return this}
  inf(p,dir,c,w=2,dash=false){const d=mul(norm(dir),this.u*1000);return this.line(sub(p,d),add(p,d),c,w,dash)}
  poly(pts,fill='var(--fig)',c='#1d2433'){this.parts.push(`<polygon points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="${fill}" stroke="${c}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`);return this}
  circle(cn,r,c='#2f6fde',w=2){this.parts.push(`<circle cx="${cn.x}" cy="${cn.y}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke"/>`);return this}
  dot(p,c='#1d2433',r=1.6){this.parts.push(`<circle cx="${p.x}" cy="${p.y}" r="${this.u*r}" fill="${c}"/>`);return this}
  text(p,s,{c='#1d2433',size=5.6,anchor='middle',bold=false}={}){this.parts.push(`<text x="${p.x}" y="${p.y}" font-size="${this.u*size}" fill="${c}" text-anchor="${anchor}" dominant-baseline="central" font-family="system-ui,sans-serif" ${bold?'font-weight="700"':''} stroke="#fffdf7" stroke-width="${this.u*1.4}" paint-order="stroke">${s}</text>`);return this}
  ra(at,d1,d2,c='#1d2433'){const s=this.u*4.2,a=add(at,mul(norm(d1),s)),b=add(at,mul(norm(d2),s)),m=add(a,mul(norm(d2),s));this.parts.push(`<polyline points="${a.x},${a.y} ${m.x},${m.y} ${b.x},${b.y}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`);return this}
  ticks(p,q,n=1,c='#1d2433'){const m=mid(p,q),d=norm(sub(q,p)),nn=perp(d),L=this.u*2.8,g=this.u*1.6;for(let i=0;i<n;i++){const o=add(m,mul(d,(i-(n-1)/2)*g));this.line(sub(o,mul(nn,L)),add(o,mul(nn,L)),c,1.6)}return this}
  arc(V,p1,p2,r,c='#d64545'){const a1=Math.atan2(p1.y-V.y,p1.x-V.x),a2=Math.atan2(p2.y-V.y,p2.x-V.x);let da=a2-a1;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;const s=add(V,P(Math.cos(a1)*r,Math.sin(a1)*r)),e=add(V,P(Math.cos(a1+da)*r,Math.sin(a1+da)*r));this.parts.push(`<path d="M${s.x} ${s.y} A${r} ${r} 0 0 ${da>0?1:0} ${e.x} ${e.y}" fill="none" stroke="${c}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`);return this}
  vlabel(V,G,s){return this.text(add(V,mul(norm(sub(V,G)),this.u*6)),s,{bold:true})}
  sideLabel(p,q,inside,s,opt={}){const m=mid(p,q);let n=norm(perp(sub(q,p)));if(dot(n,sub(inside,m))>0)n=mul(n,-1);return this.text(add(m,mul(n,this.u*5.5)),s,{c:'#c2410c',...opt})}
  svg(extra=''){return `<svg class="fig ${this.cls}" viewBox="${this.vb.join(' ')}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${this.parts.join('')}${extra}</svg>`}
}

/* ---------- skills ---------- */
const SKILLS=[
 {id:'mll',name:'Middelloodlijn & omgeschreven cirkel'},

const SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));

/* ---------- concept bank: [vraag, goed, fout, fout, fout, uitleg, hint] ---------- */
const BANK={

["Een middelloodlijn van lijnstuk AB…","gaat door het midden van AB en staat er loodrecht op","gaat door punt A en staat loodrecht op AB","gaat door het midden van AB en door een hoekpunt","deelt de hoek bij A middendoor","Middel = door het midden, lood = loodrecht. Allebei moeten kloppen.","Het woord zegt het al: midden + loodrecht."],
["Elk punt op de middelloodlijn van AB ligt…","even ver van A als van B","even ver van beide benen van een hoek","precies in het midden van AB","altijd dichter bij A dan bij B","Dat is dé eigenschap van de middelloodlijn: elk punt erop ligt even ver van A en van B.","Denk aan een school die even ver van twee dorpen moet liggen."],

["De omgeschreven cirkel van een driehoek…","gaat door alle drie de hoekpunten","raakt alle drie de zijden","gaat door de middens van de zijden","ligt altijd helemaal binnen de driehoek","Omgeschreven = er omheen, door de hoekpunten. Raken aan de zijden doet de ingeschreven cirkel.","Omgeschreven = er óm heen geschreven."],

    return {skill,key:skill+q[0],type:'mc',prompt:'Waar of niet waar? '+q[0],options:['Waar','Niet waar'],answerIndex:q[1]?0:1,explain:q[2],hints:[TF_HINT]};
  }

  const opts=shuffle(q.slice(1,5).map((t,i)=>({t,ok:i===0})));

  f.vlabel(A,G,'A');f.vlabel(B,G,'B');f.vlabel(C,G,'C');

function genTap(){
  const t=pick(['O','I','Z','H','O','H']);
  let A,B,C,pts,tries=0;
  do{
    const kind=(t==='O'||t==='H')&&Math.random()<0.4?'obtuse':'acute';
    [A,B,C]=randTri(kind);
    pts=[A,B,C,circumcenter(A,B,C),incenter(A,B,C),centroid(A,B,C),orthocenter(A,B,C)];
    const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
    var span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
    var tsize=Math.max(dist(A,B),dist(B,C),dist(A,C));
    tries++;
  }while(span>tsize*1.9&&tries<60);
  const G=centroid(A,B,C);
  const target={O:circumcenter(A,B,C),I:incenter(A,B,C),Z:G,H:orthocenter(A,B,C)}[t];
  const f=new Fig(pts,0.12);f.cls='tap';f.poly([A,B,C]);
  f.vlabel(A,G,'A');f.vlabel(B,G,'B');f.vlabel(C,G,'C');
  const tol=Math.max(tsize*0.07,f.u*5);
  const obtuse=Math.max(angleAt(A,B,C),angleAt(B,A,C),angleAt(C,A,B))>Math.PI/2;
  return {skill:'tap',key:'tap'+Math.random(),type:'tap',prompt:`Tik in de figuur op ${TAPS[t].name}.`,hints:TAPS[t].hints,fig:f,svg:f.svg(),target,tol,
    reveal(fig){
      const V=[A,B,C],red='#d64545';
      if(t==='O'){for(let i=0;i<3;i++){const p=V[i],q=V[(i+1)%3],M=mid(p,q);fig.inf(M,perp(sub(q,p)),red,1.6);fig.ticks(p,M,1,red);fig.ticks(M,q,1,red)}fig.circle(target,dist(target,A))}
      if(t==='I'){for(let i=0;i<3;i++){const p=V[i],q=V[(i+1)%3],r=V[(i+2)%3];const c=dist(p,q),b=dist(p,r);const D=add(q,mul(sub(r,q),c/(b+c)));fig.line(p,D,red,1.6)}fig.circle(target,inradius(A,B,C));const F=foot(target,A,B);fig.line(target,F,'#2f6fde',1.6,true)}
      if(t==='Z'){for(let i=0;i<3;i++){const p=V[i],q=V[(i+1)%3],r=V[(i+2)%3];const M=mid(q,r);fig.line(p,M,red,1.6);fig.ticks(q,M,i+1,red);fig.ticks(M,r,i+1,red)}}
      if(t==='H'){for(let i=0;i<3;i++){const p=V[i],q=V[(i+1)%3],r=V[(i+2)%3];fig.inf(q,sub(r,q),'#9ca3af',1.2,true);fig.inf(p,perp(sub(r,q)),red,1.6)}}
    },
    explain:TAPS[t].how+(obtuse&&(t==='O'||t==='H')?' Deze driehoek is <b>stomphoekig</b>, daarom ligt het punt buiten de driehoek.':'')+' Groen = juiste punt, blauw = jouw tik.'};
}

/* ---------- area: triangle ---------- */
function units(){
  const r=Math.random();
  if(r<0.25)return {u:'mm',b:RI(20,80),h:RI(15,60),e:()=>RI(8,25)};
  if(r<0.5)return {u:'cm',b:RI(20,90)/10,h:RI(15,70)/10,e:()=>RI(8,25)/10};
  return {u:'cm',b:RI(4,14),h:RI(3,11),e:()=>RI(2,5)};
}
function genOpTri(){
  const U=units(),b=U.b,h=U.h,obtuse=Math.random()<0.4,flip=Math.random()<0.5;
  let ax,ext=0;
  if(obtuse){ext=U.e();ax=b+ext}else{ax=b*R(0.22,0.78)}
  let A=P(0,0),B=P(b,0),C=P(ax,-h),F=P(ax,0);
  if(flip){[A,B,C,F]=[A,B,C,F].map(p=>P(b-p.x,p.y))}
  const f=new Fig([A,B,C,F]);const G=centroid(A,B,C);
  if(obtuse)f.line(flip?A:B,F,'#6b7280',1.6,true);
  f.poly([A,B,C]);
  f.line(C,F,'#2f6fde',2,true);f.ra(F,sub(C,F),sub(mid(A,B),F),'#2f6fde');
  f.vlabel(A,G,'A');f.vlabel(B,G,'B');f.vlabel(C,G,'C');
  f.text(add(mid(A,B),P(0,f.u*7)),fmt(b),{c:'#c2410c'});
  f.text(add(mid(C,F),P((flip?-1:1)*(obtuse?1:-1)*f.u*6,0)),fmt(h),{c:'#2f6fde'});
  let extra='';
  if(obtuse){const E0=flip?A:B;f.text(add(mid(E0,F),P(0,f.u*7)),fmt(ext),{c:'#6b7280'});extra=` Het verlengde stuk (${fmt(ext)}) is alleen een hulplijn: dat tel je <b>niet</b> mee.`}
  else{const s=Math.round(dist(A,C)*10)/10;f.sideLabel(A,C,G,fmt(s));extra=` De schuine zijde AC (${fmt(s)}) heb je niet nodig.`}
  const ans=b*h/2;
  return {skill:'optri',key:'optri'+Math.random(),type:'num',prompt:`Bereken de oppervlakte van △ABC. De maten zijn in ${U.u}.`,svg:f.svg(),answer:ans,unit:U.u+'²',hints:['Zoek de hoogte (blauwe stippellijn met rechte hoek). Op welke zijde staat die loodrecht? Niet alle getallen heb je nodig.',`Opp. = ½ × ${fmt(b)} × ${fmt(h)}`],
    explain:`De hoogte ${fmt(h)} hoort bij zijde AB = ${fmt(b)} (ze staan loodrecht op elkaar).<br>Opp. = ½ × ${fmt(b)} × ${fmt(h)} = <b>${fmt(ans)} ${U.u}²</b>.${extra}`};
}
function genOpPar(){
  const U=units(),b=U.b,h=U.h,s=b*R(0.2,0.5);
  const A=P(0,0),B=P(b,0),C=P(b+s,-h),D=P(s,-h),F=P(s,0);
  const f=new Fig([A,B,C,D]);const G=mid(A,C);
  f.poly([A,B,C,D]);f.line(D,F,'#2f6fde',2,true);f.ra(F,sub(D,F),sub(B,F),'#2f6fde');
  ['A','B','C','D'].forEach((n,i)=>f.vlabel([A,B,C,D][i],G,n));
  f.text(add(mid(A,B),P(0,f.u*7)),fmt(b),{c:'#c2410c'});
  f.text(add(mid(D,F),P(f.u*6,0)),fmt(h),{c:'#2f6fde'});
  const sl=Math.round(dist(A,D)*10)/10;f.sideLabel(A,D,G,fmt(sl));

    explain:`Opp. parallellogram = zijde × bijbehorende hoogte = ${fmt(b)} × ${fmt(h)} = <b>${fmt(ans)} ${U.u}²</b>.<br>Geen ½! En de schuine zijde (${fmt(sl)}) is <b>niet</b> de hoogte.`};
}
function genOpTrap(){
  const U=units();let a=U.b,h=U.h;let c=Math.round(a*R(0.35,0.7)*(U.u==='mm'?1:10))/(U.u==='mm'?1:10);if(U.b%1===0&&U.u==='cm')c=Math.max(2,Math.round(a*R(0.35,0.7)));
  const right=Math.random()<0.3;const p=right?0:(a-c)*R(0.2,0.8);
  const A=P(0,0),B=P(a,0),C=P(p+c,-h),D=P(p,-h),F=P(p,0);
  const f=new Fig([A,B,C,D]);const G=centroid(A,B,C);
  f.poly([A,B,C,D]);

  return {skill:'optrap',key:'optrap'+Math.random(),type:'num',prompt:`Bereken de oppervlakte van trapezium ABCD (AB // CD). De maten zijn in ${U.u}.`,svg:f.svg(),answer:ans,unit:U.u+'²',hints:['Trapezium: ½ × (som van de twee evenwijdige zijden) × hoogte.',`Opp. = ½ × (${fmt(a)} + ${fmt(c)}) × ${fmt(h)}`],
    explain:`Opp. trapezium = ½ × (som evenwijdige zijden) × hoogte = ½ × (${fmt(a)} + ${fmt(c)}) × ${fmt(h)} = ½ × ${fmt(a+c)} × ${fmt(h)} = <b>${fmt(ans)} ${U.u}²</b>.`};
}
function genTerug(){
  const v=pick(['tri','par','trap']);
  if(v==='tri'){const z=RI(4,16),h=RI(3,12),A=z*h/2;return {skill:'terug',key:'terug'+Math.random(),type:'num',prompt:`Een driehoek ABC heeft een oppervlakte van ${fmt(A)} cm². Zijde AB is ${z} cm. Hoe lang is de hoogte die bij AB hoort?`,answer:h,unit:'cm',hints:['Schrijf de formule op en vul in wat je weet: ½ × zijde × hoogte = oppervlakte.',`Hoogte = 2 × ${fmt(A)} ÷ ${z}`],explain:`½ × ${z} × hoogte = ${fmt(A)}, dus hoogte = 2 × ${fmt(A)} ÷ ${z} = ${fmt(2*A)} ÷ ${z} = <b>${h} cm</b>.`}}
  if(v==='par'){const z=RI(4,15),h=RI(3,12),A=z*h;return {skill:'terug',key:'terug'+Math.random(),type:'num',prompt:`Een parallellogram heeft een oppervlakte van ${A} cm². Eén zijde is ${z} cm. Hoe lang is de hoogte die bij die zijde hoort?`,answer:h,unit:'cm',hints:['Parallellogram: zijde × hoogte = oppervlakte. Werk terug.',`Hoogte = ${A} ÷ ${z}`],explain:`${z} × hoogte = ${A}, dus hoogte = ${A} ÷ ${z} = <b>${h} cm</b>.`}}
  const a=RI(7,16),c=RI(3,a-2),hh=pick([RI(3,10),RI(6,19)/2]),A=(a+c)*hh/2;
  return {skill:'terug',key:'terug'+Math.random(),type:'num',prompt:`Van trapezium ABCD is AB // CD, AB = ${a} cm, CD = ${c} cm en de oppervlakte is ${fmt(A)} cm². Bereken de hoogte.`,answer:hh,unit:'cm',hints:['Trapezium: ½ × (AB + CD) × hoogte = oppervlakte. Werk terug.',`Hoogte = 2 × ${fmt(A)} ÷ (${a} + ${c})`],explain:`½ × (${a} + ${c}) × hoogte = ${fmt(A)}, dus hoogte = 2 × ${fmt(A)} ÷ ${a+c} = ${fmt(2*A)} ÷ ${a+c} = <b>${fmt(hh)} cm</b>.`};
}
function genCoord(){
  let x1,y1,y2,x3,y3;
  do{x1=RI(-4,4);y1=RI(-4,4);y2=y1+RI(2,6)*pick([1,-1]);x3=x1+RI(2,7)*pick([1,-1]);y3=RI(-5,5)}while(y2<-5||y2>5||x3<-5||x3>5);
  const horiz=Math.random()<0.5;
  let p=[[x1,y1],[x1,y2],[x3,y3]];if(horiz)p=p.map(([x,y])=>[y,x]);
  const n=shuffle(['P','Q','R']).slice(0,1)[0];const names=['P','Q','R'];
  const pts=p.map(([x,y])=>P(x,-y));
  const f=new Fig([P(-6,-6),P(6,6)],0.04);
  for(let i=-6;i<=6;i++){f.line(P(i,-6),P(i,6),'#e5e1d8',1);f.line(P(-6,i),P(6,i),'#e5e1d8',1)}
  f.line(P(-6,0),P(6,0),'#9ca3af',1.4);f.line(P(0,-6),P(0,6),'#9ca3af',1.4);
  f.text(P(5.6,0.45),'x',{c:'#6b7280',size:4.5});f.text(P(0.45,-5.6),'y',{c:'#6b7280',size:4.5});
  f.poly(pts,'rgba(251,238,199,.85)');const G=centroid(...pts);
  pts.forEach((q,i)=>{f.dot(q);f.vlabel(q,G,names[i])});
  const L=Math.abs(y2-y1),H=Math.abs(x3-x1);
  const ans=L*H/2;
  const cs=p.map(([x,y],i)=>`${names[i]}(${x}, ${y})`).join(', ');
  return {skill:'coord',key:'coord'+Math.random(),type:'num',prompt:`Bereken de oppervlakte van △PQR met ${cs}. De roostervierkantjes zijn 1 bij 1 cm.`,svg:f.svg(),answer:ans,unit:'cm²',hints:[`Welke twee punten hebben dezelfde ${horiz?'y':'x'}-coördinaat? Die zijde kun je gewoon tellen.`,`De zijde is ${L} hokjes. De hoogte is de afstand van het derde punt tot die zijde, recht geteld.`],
    explain:`PQ loopt ${horiz?'horizontaal (zelfde y)':'verticaal (zelfde x)'}, dus PQ = ${L}. De hoogte bij PQ is de ${horiz?'verticale':'horizontale'} afstand van R tot die lijn = ${H}.<br>Opp. = ½ × ${L} × ${H} = <b>${fmt(ans)} cm²</b>.`};
}
function genSamen(){
  if(Math.random()<0.5){
    const W=RI(7,12),H=RI(6,10),w=RI(2,W-4),hh=RI(2,H-3);
    const pts=[P(0,0),P(W,0),P(W,-(H-hh)),P(W-w,-(H-hh)),P(W-w,-H),P(0,-H)];
    const f=new Fig(pts);f.poly(pts);f.line(P(W-w,-(H-hh)),P(W-w,0),'#9ca3af',1.4,true);
    f.text(P(W/2,f.u*7),W,{c:'#c2410c'});f.text(P(-f.u*6,-H/2),H,{c:'#c2410c'});
    f.text(P((W-w)/2,-H-f.u*6),W-w,{c:'#c2410c'});f.text(P(W+f.u*6,-(H-hh)/2),H-hh,{c:'#c2410c'});
    const ans=W*H-w*hh;
    return {skill:'samen',key:'samen'+Math.random(),type:'num',prompt:'Bereken de oppervlakte van deze figuur. Alle hoeken zijn recht. De maten zijn in cm.',svg:f.svg(),answer:ans,unit:'cm²',hints:['Maak er in gedachten één grote rechthoek van en haal het ontbrekende hoekje eraf.',`Grote rechthoek = ${W} × ${H}. Hoe breed en hoog is het hoekje? Trek de maten van elkaar af.`],
      explain:`<b>Stukje toevoegen:</b> grote rechthoek ${W} × ${H} = ${W*H}. Het ontbrekende hoekje is ${W} − ${W-w} = ${w} breed en ${H} − ${H-hh} = ${hh} hoog, dus ${w*hh}.<br>Opp. = ${W*H} − ${w*hh} = <b>${ans} cm²</b>.<br>(Splitsen kan ook: ${W-w} × ${H} + ${w} × ${H-hh} = ${(W-w)*H} + ${w*(H-hh)} = ${ans}.)`};
  }
  const W=RI(4,12)*1,H1=RI(3,8),H2=RI(2,6),ax=W*R(0.3,0.7);
  const pts=[P(0,0),P(W,0),P(W,-H1),P(ax,-H1-H2),P(0,-H1)];
  const f=new Fig(pts);f.poly(pts);f.line(P(0,-H1),P(W,-H1),'#9ca3af',1.4,true);
  f.line(P(ax,-H1-H2),P(ax,-H1),'#2f6fde',2,true);f.ra(P(ax,-H1),P(0,-1),P(1,0),'#2f6fde');
  f.text(P(W/2,f.u*7),W,{c:'#c2410c'});f.text(P(-f.u*6,-H1/2),H1,{c:'#c2410c'});f.text(P(ax+f.u*6,-H1-H2/2),H2,{c:'#2f6fde'});
  const ans=W*H1+W*H2/2;
  return {skill:'samen',key:'samen'+Math.random(),type:'num',prompt:'Bereken de oppervlakte van deze figuur (een rechthoek met een driehoek erop). De maten zijn in cm.',svg:f.svg(),answer:ans,unit:'cm²',hints:['Splits de figuur in een rechthoek en een driehoek.',`Rechthoek ${W} × ${H1}, driehoek ½ × ${W} × ${H2}. Tel ze op.`],
    explain:`<b>Splitsen:</b> rechthoek ${W} × ${H1} = ${W*H1}. Driehoek: zijde ${W}, hoogte ${H2}, dus ½ × ${W} × ${H2} = ${fmt(W*H2/2)}.<br>Opp. = ${W*H1} + ${fmt(W*H2/2)} = <b>${fmt(ans)} cm²</b>.`};
}



const GEN={mll:()=>genBank('mll'),bis:()=>genBank('bis'),zh:()=>genBank('zh'),kleur:()=>genBank('kleur'),theorie:()=>genBank('theorie'),herken:genHerken,tap:genTap,optri:genOpTri,oppar:genOpPar,optrap:genOpTrap,terug:genTerug,coord:genCoord,samen:genSamen};
const THEORY=['mll','bis','zh','kleur','herken','tap','theorie'];
const CALC=['optri','oppar','optrap','terug','coord','samen'];

/* ---------- adaptive state ---------- */
const KEY='h2-trainer-v1';
const TEST_LEN=15, TARGET_M=0.6, TARGET_N=3;
let state={m:{},n:{},c:{},retry:[],topic:'all',tests:[]};
let recent=[],session={n:0,c:0,streak:0},lastSkills=[];
let mode='practice', test=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.m)state=Object.assign(state,s);if(!state.tests)state.tests=[]}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const mast=id=>state.m[id]??0.3;
function record(skill,ok,hinted){
  const m=mast(skill);
  state.m[skill]=ok?m+(1-m)*(hinted?0.1:0.25):m*0.5;
  state.n[skill]=(state.n[skill]||0)+1;
  if(ok)state.c[skill]=(state.c[skill]||0)+1;
  if(!ok&&!state.retry.some(r=>r.skill===skill))state.retry.push({skill,due:2});
  save();
}
function skillReady(id){return Math.min(1,mast(id)/TARGET_M)*Math.min(1,(state.n[id]||0)/TARGET_N)}
function readiness(){const r=SKILLS.map(s=>skillReady(s.id));return {pct:r.reduce((a,b)=>a+b,0)/r.length,ready:r.every(x=>x>=0.999)}}
function allowed(){const t=state.topic;if(t==='all')return SKILLS.map(s=>s.id);if(t==='theory')return THEORY;if(t==='calc')return CALC;return [t]}
function chooseSkill(){
  const ok=allowed();
  state.retry.forEach(r=>r.due--);
  const i=state.retry.findIndex(r=>r.due<=0&&ok.includes(r.skill));
  if(i>=0){const s=state.retry.splice(i,1)[0].skill;save();return {skill:s,retry:true}}
  if(ok.length===1)return {skill:ok[0]};
  const w=ok.map(id=>{let x=Math.pow(1-mast(id),2)+0.04;if((state.n[id]||0)<TARGET_N)x+=0.15;if(lastSkills[0]===id)x*=0.15;else if(lastSkills[1]===id)x*=0.5;return x});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<ok.length;k++){r-=w[k];if(r<=0)return {skill:ok[k]}}
  return {skill:ok[0]};
}

/* ---------- UI ---------- */
function $(id){return document.getElementById(id)}
let cur=null,answered=false;
function newQ(skill){const q=GEN[skill]();q.hintsUsed=0;recent.unshift(q.key);recent=recent.slice(0,12);return q}
function nextQ(){
  const ch=chooseSkill();
  cur=newQ(ch.skill);cur.retry=!!ch.retry;answered=false;
  lastSkills.unshift(ch.skill);lastSkills=lastSkills.slice(0,3);
  render();
}
function render(){
  const q=cur,inTest=mode==='test';
  $('qcard').style.display='block';$('result').classList.remove('open');
  $('ready').style.display=inTest?'none':'flex';
  $('progBtn').style.display=inTest?'none':'inline-block';
  $('testctl').style.display=inTest?'flex':'none';
  $('tprog').style.display=inTest?'block':'none';
  if(inTest){$('chip').textContent=`Test · Question ${test.i+1} of ${test.qs.length}`;$('chip').className='chip test';$('tprog').firstChild.style.width=(test.i/test.qs.length*100)+'%'}
  else{$('chip').textContent=(q.retry?'Again: ':'')+SK[q.skill].name;$('chip').className='chip'+(q.retry?' retry':'')}
  $('prompt').textContent=q.prompt;
  $('figwrap').innerHTML=q.svg||'';
  $('fb').className='fb';$('fb').innerHTML='';$('hints').innerHTML='';
  $('nextBtn').style.display='none';
  const hb=$('hintBtn');hb.style.display=(!inTest&&q.hints&&q.hints.length)?'inline-block':'none';hb.disabled=false;hb.textContent='💡 Hint';
  const a=$('answer');a.innerHTML='';
  if(q.type==='mc'){
    const box=document.createElement('div');box.className='opts';
    q.options.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>onMC(i,b);box.appendChild(b)});
    a.appendChild(box);
  }else if(q.type==='num'){
    a.innerHTML=`<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" placeholder="Your answer"><span class="unit">${q.unit}</span><button class="btn primary" id="chk">${inTest?'Next':'Check'}</button></div>`;
    $('chk').onclick=onNum;$('num').addEventListener('keydown',e=>{if(e.key==='Enter')onNum()});
  }else if(q.type==='tap'){
    const svg=$('figwrap').querySelector('svg');
    svg.addEventListener('click',e=>{if(answered)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());onTap(P(p.x,p.y))});
  }
  updStats();renderReady();
}
function showHint(){
  if(answered||!cur.hints)return;
  const i=cur.hintsUsed;if(i>=cur.hints.length)return;
  cur.hintsUsed++;
  const d=document.createElement('div');d.className='hintbox';d.innerHTML=`<b>Hint ${i+1}:</b> ${cur.hints[i]}`;$('hints').appendChild(d);
  const hb=$('hintBtn');
  if(cur.hintsUsed<cur.hints.length)hb.textContent='💡 Another hint';else{hb.textContent='No more hints';hb.disabled=true}
}
/* answer handlers */
function parseNum(s){const v=parseFloat(s.replace(',','.').replace(/[^0-9.\-]/g,''));return isNaN(v)?null:v}
const numOk=(v,a)=>Math.abs(v-a)<=Math.max(0.011,Math.abs(a)*0.002);
function onMC(i,btn){
  if(answered)return;const ok=i===cur.answerIndex;
  if(mode==='test'){answered=true;btn.classList.add('chosen');testAnswer(ok,i);return}
  const bs=$('answer').querySelectorAll('.opt');bs[cur.answerIndex].classList.add('right');if(!ok)bs[i].classList.add('wrong');
  finish(ok,cur.explain);
}
function onNum(){
  if(answered)return;const raw=$('num').value.trim();if(!raw)return;
  const v=parseNum(raw);if(v===null)return;
  const ok=numOk(v,cur.answer);
  $('num').disabled=true;$('chk').disabled=true;
  if(mode==='test'){answered=true;testAnswer(ok,v);return}
  finish(ok,(ok?'':`You answered ${fmt(v)}. `)+cur.explain);
}
function drawTapReveal(q,p){
  const f=q.fig;q.reveal(f);f.dot(q.target,'#1f9d55',2.6);
  const s=f.u*3;f.line(P(p.x-s,p.y-s),P(p.x+s,p.y+s),'#2f6fde',3);f.line(P(p.x-s,p.y+s),P(p.x+s,p.y-s),'#2f6fde',3);
  f.cls='';return f.svg();
}
function onTap(p){
  const ok=dist(p,cur.target)<=cur.tol;
  if(mode==='test'){answered=true;testAnswer(ok,p);return}
  $('figwrap').innerHTML=drawTapReveal(cur,p);
  finish(ok,cur.explain);
}
function finish(ok,html){
  answered=true;const hinted=cur.hintsUsed>0;record(cur.skill,ok,hinted);
  session.n++;if(ok){session.c++;session.streak++}else session.streak=0;
  $('hintBtn').style.display='none';
  const fb=$('fb');fb.className='fb '+(ok?'ok':'bad');
  const v=ok?(hinted?'Correct, with a hint.':pick(['Correct!','Well done!','Right!'])):'Not quite.';
  fb.innerHTML=`<b class="v">${v}</b>${html}`;
  $('nextBtn').style.display='block';updStats();renderSkills();renderReady();
  $('nextBtn').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function updStats(){$('stats').textContent=mode==='test'?'Test':`${session.c}/${session.n}`+(session.streak>=3?` · 🔥${session.streak}`:'')}
function color(m){return m>=0.85?'#1f9d55':m>=0.6?'#7cb342':m>=0.4?'#e8a33d':'#d64545'}
function renderSkills(){
  $('skills').innerHTML=SKILLS.map(s=>{const m=mast(s.id),n=state.n[s.id]||0,c=state.c[s.id]||0,rd=skillReady(s.id)>=0.999;
    return `<div class="sk"><div>${s.name}${rd?' ✓':''}<div class="small">${n?`${c}/${n} correct`:'Not practised yet'}</div></div><div class="pct">${n?Math.round(m*100)+'%':'–'}</div><div class="bar"><i style="width:${n?Math.round(m*100):0}%;background:${color(m)}"></i></div></div>`}).join('');
  const h=state.tests.slice(-8).reverse();
  $('histwrap').innerHTML=h.length?`<h3>Test results</h3>`+h.map(t=>`<div class="hist"><span>${t.date}</span><span>${t.score}/${t.total} · grade <b>${t.grade}</b></span></div>`).join(''):'';
}
function renderReady(){
  if(mode!=='practice')return;
  const {pct,ready}=readiness();const el=$('ready');
  el.className='card ready'+(ready?' done':'');
  if(ready){
    el.innerHTML=`<div class="top"><b>🎓 Ready for the test!</b></div><div class="small" style="color:var(--ink)">${TEST_LEN} questions on all topics. No hints, and no answers until the end. You get a grade at the end.</div><button class="btn go" id="startTest">Start test</button>`;
    $('startTest').onclick=startTest;
  }else{
    const weak=SKILLS.filter(s=>skillReady(s.id)<0.999).sort((a,b)=>skillReady(a.id)-skillReady(b.id)).slice(0,2).map(s=>s.name);
    el.innerHTML=`<div class="top"><b>🔒 Test readiness</b><span class="pct">${Math.round(pct*100)}%</span></div><div class="bar"><i style="width:${Math.round(pct*100)}%;background:${color(pct)}"></i></div><div class="small">The test unlocks when every topic has been practised enough. Still to do: ${weak.join(', ')}${SKILLS.filter(s=>skillReady(s.id)<0.999).length>2?' and more':''}.</div>`;
  }
}

/* ---------- test mode ---------- */
function startTest(){
  const ids=shuffle(SKILLS.map(s=>s.id));
  const weak=SKILLS.map(s=>s.id).sort((a,b)=>mast(a)-mast(b));
  let extra=[];for(const id of weak){if(ids.length+extra.length>=TEST_LEN)break;extra.push(id)}
  const list=shuffle(ids.concat(extra)).slice(0,TEST_LEN);
  test={qs:list.map(id=>newQ(id)),i:0,given:[],ok:[]};
  mode='test';$('panel').classList.remove('open');
  cur=test.qs[0];answered=false;render();window.scrollTo({top:0});
}
function testAnswer(ok,given){
  test.ok[test.i]=ok;test.given[test.i]=given;
  setTimeout(()=>{test.i++;if(test.i>=test.qs.length)endTest();else{cur=test.qs[test.i];answered=false;render();window.scrollTo({top:0})}},cur.type==='mc'?350:150);
}
function endTest(){
  mode='result';
  const score=test.ok.filter(Boolean).length,total=test.qs.length;
  const grade=Math.round((1+9*score/total)*10)/10;
  test.qs.forEach((q,i)=>record(q.skill,test.ok[i],false));
  const d=new Date();
  state.tests.push({date:d.toLocaleDateString('nl-NL')+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),score,total,grade:fmt(grade)});save();
  $('qcard').style.display='none';$('ready').style.display='none';$('progBtn').style.display='inline-block';updStats();
  const pass=grade>=5.5;
  const rows=test.qs.map((q,i)=>{
    const ok=test.ok[i],g=test.given[i];
    let fig='',your='',right='';
    if(q.type==='mc'){fig=q.svg||'';your=g==null?'–':q.options[g];right=q.options[q.answerIndex]}
    if(q.type==='num'){fig=q.svg||'';your=g==null?'–':fmt(g)+' '+q.unit;right=fmt(q.answer)+' '+q.unit}
    if(q.type==='tap'){fig=ok?'':drawTapReveal(q,g);your=ok?'tapped the right spot':'blue cross';right='green point'}
    return `<div class="rv"><div class="h"><span class="mark">${ok?'✅':'❌'}</span><span>${i+1}. ${q.prompt}</span></div>${ok?'':fig}<div class="ans">${ok?'':`Your answer: <b>${your}</b><br>`}Correct: <b>${right}</b></div>${ok?'':`<div class="ex">${q.explain}</div>`}</div>`;
  }).join('');
  const wrongSkills=[...new Set(test.qs.filter((q,i)=>!test.ok[i]).map(q=>SK[q.skill].name))];
  $('result').innerHTML=`<span class="chip test">Test result</span><div class="grade ${pass?'pass':'fail'}">${fmt(grade)}</div><div style="font-weight:600">${score} of ${total} correct${pass?' – passed! 🎉':' – keep practising'}</div>
    ${wrongSkills.length?`<div class="small" style="margin-top:6px">Practise these topics again: ${wrongSkills.join(', ')}. They will come up more often now.</div>`:'<div class="small" style="margin-top:6px">Perfect score!</div>'}
    <div class="row"><button class="btn primary" id="backPractice">Back to practice</button></div>
    <h3 style="margin-top:16px">Review</h3>${rows}
    <div class="row"><button class="btn primary" id="backPractice2">Back to practice</button></div>`;
  $('result').classList.add('open');
  $('backPractice').onclick=$('backPractice2').onclick=()=>{mode='practice';test=null;$('result').classList.remove('open');nextQ();window.scrollTo({top:0})};
  window.scrollTo({top:0});renderSkills();
}

function init(){
  load();
  const sel=$('topic');
  sel.innerHTML=`<option value="all">All topics (adaptive)</option><option value="theory">Theory only</option><option value="calc">Calculations only</option>`+SKILLS.map(s=>`<option value="${s.id}">Only: ${s.name}</option>`).join('');
  sel.value=state.topic;sel.onchange=()=>{state.topic=sel.value;save();$('panel').classList.remove('open');nextQ()};
  $('progBtn').onclick=()=>{renderSkills();$('panel').classList.toggle('open');window.scrollTo({top:0,behavior:'smooth'})};
  $('closePanel').onclick=()=>$('panel').classList.remove('open');
  $('hintBtn').onclick=showHint;
  let armed=false;
  $('resetBtn').onclick=()=>{if(!armed){armed=true;$('resetBtn').textContent='Tap again to reset';setTimeout(()=>{armed=false;$('resetBtn').textContent='Reset progress'},3000);return}
    state={m:{},n:{},c:{},retry:[],topic:'all',tests:[]};save();sel.value='all';armed=false;$('resetBtn').textContent='Reset progress';renderSkills();nextQ()};
  let qarmed=false;
  $('quitBtn').onclick=()=>{if(!qarmed){qarmed=true;$('quitBtn').textContent='Tap again to quit (no grade)';setTimeout(()=>{qarmed=false;$('quitBtn').textContent='Quit test'},3000);return}
    qarmed=false;$('quitBtn').textContent='Quit test';mode='practice';test=null;nextQ()};
  $('nextBtn').onclick=nextQ;
  renderSkills();nextQ();
}
if(typeof document!=='undefined')init();
</script>
</body>
